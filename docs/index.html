<style>
:root{
  --ground:#F1F3F6; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --ink:#131A21; --ink-2:#3D4954; --muted:#66727E; --line:#DCE2E8; --line-2:#EAEEF2;
  --accent:#17557F; --accent-soft:#E3EDF5; --on-accent:#FFFFFF;
  --warn:#8A5A0B; --warn-soft:#FAF0DC;
  --down:#D42A1E; --down-soft:#FAE7E3;
  --up:#00853A; --up-soft:#E4F0EA;
  --shadow:0 1px 2px rgba(19,26,33,.05), 0 8px 24px -16px rgba(19,26,33,.22);
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10141A; --surface:#171C23; --surface-2:#1D242C;
    --ink:#E5EAF0; --ink-2:#C2CCD6; --muted:#8E9BA8; --line:#2A333D; --line-2:#222A33;
    --accent:#7FB2D6; --accent-soft:#1B2C39; --on-accent:#0E141A;
    --warn:#D9A758; --warn-soft:#2E2617;
    --down:#FF6B5E; --down-soft:#33201C;
    --up:#3DDC84; --up-soft:#16281F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#10141A; --surface:#171C23; --surface-2:#1D242C;
  --ink:#E5EAF0; --ink-2:#C2CCD6; --muted:#8E9BA8; --line:#2A333D; --line-2:#222A33;
  --accent:#7FB2D6; --accent-soft:#1B2C39; --on-accent:#0E141A;
  --warn:#D9A758; --warn-soft:#2E2617;
  --down:#FF6B5E; --down-soft:#33201C;
  --up:#3DDC84; --up-soft:#16281F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px; margin:0 auto; padding:32px 20px 64px; display:flex; flex-direction:column; gap:18px}

/* ---------- header ---------- */
header{display:flex; flex-direction:column; gap:6px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--serif); font-weight:600; font-size:30px; line-height:1.3; margin:0; letter-spacing:.01em}

.statbar{
  display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline;
  padding:12px 16px; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; box-shadow:var(--shadow);
}
.stat{display:flex; align-items:baseline; gap:7px; font-size:13px; color:var(--muted)}
.stat b{font-family:var(--mono); font-weight:600; font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums}
.stat .dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:1px}
.stat.up b{color:var(--up)} .stat.up .dot{background:var(--up)}
.stat.down b{color:var(--down)} .stat.down .dot{background:var(--down)}
.statbar .spacer{flex:1 1 auto}
.checked{font-size:12.5px; color:var(--muted); font-family:var(--mono); font-variant-numeric:tabular-nums}
.checked .live{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--up); margin-right:6px; vertical-align:1px}

/* ---------- controls ---------- */
.controls{
  position:sticky; top:0; z-index:20;
  display:flex; flex-direction:column; gap:18px;
  padding:18px; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; box-shadow:var(--shadow);
}
.tabs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.tab{
  text-align:left; cursor:pointer;
  font-family:var(--sans); padding:13px 15px 12px; border-radius:7px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
  display:flex; flex-direction:column; gap:4px; min-width:0;
}
.tab:hover{border-color:var(--muted)}
.tab .head{display:flex; align-items:flex-start; gap:8px}
.tab .t1{font-size:14.5px; font-weight:500; line-height:1.4; min-width:0}
.tab .t2{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.7}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.tab[aria-selected="true"] .t2{opacity:.8}
.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.chips{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.chips .lbl{font-size:13px; color:var(--muted); margin-right:6px}
.chip{
  font-family:var(--sans); font-size:13.5px; padding:6px 15px; cursor:pointer;
  background:transparent; color:var(--ink-2);
  border:1px solid var(--line); border-radius:999px; white-space:nowrap;
}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500}

/* ---------- table ---------- */
.list{background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden}
.lhead,.row{
  display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) 130px;
  gap:14px; align-items:center;
}
.lhead{
  padding:10px 18px; border-bottom:1px solid var(--line); background:var(--surface-2);
  font-size:12.5px; color:var(--muted);
}
.lhead .cur{color:var(--ink); font-weight:500}
.lhead .r,.row .mv{text-align:right}
.row{padding:14px 18px; border-bottom:1px solid var(--line-2)}
.row:nth-child(even){background:var(--surface-2)}
.row:last-child{border-bottom:0}
.cat{min-width:0}
.code{display:block; font-family:var(--mono); font-weight:600; font-size:16px; color:var(--ink); letter-spacing:-.01em; line-height:1.35}
.cn{display:block; font-size:12.5px; color:var(--muted); line-height:1.45; margin-top:1px}
.old,.new{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; letter-spacing:-.01em}
.old{color:var(--muted)}
.new{color:var(--ink); font-weight:600}
.old .k,.new .k{display:none}
.mv{font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap}
.mv.up{color:var(--up)} .mv.down{color:var(--down)}
.mv .arr{font-family:var(--mono); margin-right:3px}
.tally{
  display:flex; flex-wrap:wrap; gap:6px 20px; align-items:baseline;
  padding:11px 18px; border-top:1px solid var(--line); background:var(--surface-2);
  font-size:13px; color:var(--muted);
}
.tally .stat b{font-size:15px}

/* ---------- footer ---------- */
footer{font-size:12.5px; color:var(--muted); line-height:1.75; padding:0 2px; display:flex; flex-wrap:wrap; gap:4px 16px}
footer a{color:var(--accent); text-decoration:none}
footer a:hover{text-decoration:underline}

@media (max-width:720px){
  .wrap{padding:20px 16px 44px}
  h1{font-size:24px}
  .controls{position:static; padding:14px; gap:14px}
  .tabs{gap:8px}
  .tab{padding:11px 12px 10px}
  .chips{gap:8px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:13px 14px}
  .cat{grid-column:1; grid-row:1 / span 2}
  .new{grid-column:2; grid-row:1; text-align:right}
  .mv{grid-column:2; grid-row:2; font-size:13px}
  .old{grid-column:1 / -1; grid-row:3; font-size:12.5px; margin-top:4px}
  .old .k{display:inline; font-family:var(--sans); margin-right:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

const CHARTS = ["family_filing", "family_final", "employment_filing", "employment_final"];
const SUB = {family_final:"Family · Final Action", family_filing:"Family · Filing",
             employment_final:"Employment · Final Action", employment_filing:"Employment · Filing"};
const COUNTRIES = Object.keys(D.labels.countries);
const L = D.labels;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ym = m => m ? m : "—";
const monthCn = m => { const [y, mo] = m.split("-"); return `${y} 年 ${+mo} 月`; };

// 状态：URL hash 优先（方便 Wix 里嵌入指定表格，如 #employment_final/CN），其次本机记忆
let state = {chart: "family_filing", country: "CN"};
try { Object.assign(state, JSON.parse(localStorage.getItem("vb-state") || "{}")); } catch (e) {}
function readHash(){
  const [c, k] = location.hash.slice(1).split("/");
  if (CHARTS.includes(c)) state.chart = c;
  if (COUNTRIES.includes(k)) state.country = k;
}
readHash();
if (!CHARTS.includes(state.chart)) state.chart = "family_filing";
if (!COUNTRIES.includes(state.country)) state.country = "CN";
window.addEventListener("hashchange", () => { readHash(); render(); });

document.getElementById("s-cur").textContent = monthCn(D.cur.month);
document.getElementById("h-old").textContent = D.prev ? `${D.prev.month} 截止日` : "上月";
document.getElementById("h-new").textContent = `${D.cur.month} 截止日`;
document.getElementById("src-page").href = D.cur.page;
document.getElementById("src-pdf").href = D.cur.pdf;

const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = CHARTS.map(c => `
  <button class="tab" role="tab" data-c="${c}" aria-selected="false">
    <span class="head">
      <span class="t1">${esc(L.charts[c])}</span>
    </span>
    <span class="t2">${SUB[c]}</span>
  </button>`).join("");

const chipsEl = document.getElementById("chips");
chipsEl.insertAdjacentHTML("beforeend", COUNTRIES.map(c =>
  `<button class="chip" data-k="${c}" aria-pressed="false">${esc(L.countries[c])}</button>`).join(""));


function cell(v, cls, label){
  return `<span class="${cls}"><span class="k">${label}</span>${esc(v)}</span>`;
}

function render(){
  tabsEl.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.c === state.chart)));
  chipsEl.querySelectorAll(".chip").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.k === state.country)));

  const rows = D.charts[state.chart];
  let up = 0, down = 0;
  document.getElementById("rows").innerHTML = rows.map(r => {
    const x = r.cells[state.country];
    const cat = L.categories[r.key];
    if (x.kind === "up") up++;
    if (x.kind === "down") down++;
    const arr = x.kind === "up" ? "↑" : x.kind === "down" ? "↓" : "";
    return `<div class="row" role="row">
      <span class="cat" role="cell"><span class="code">${esc(cat.code)}</span><span class="cn">${esc(cat.cn)}</span></span>
      ${cell(x.old, "old", "上月")}
      ${cell(x.new, "new", "")}
      <span class="mv ${x.kind}" role="cell">${arr ? `<span class="arr">${arr}</span>` : ""}${esc(x.text)}</span>
    </div>`;
  }).join("");
  document.getElementById("s-up").textContent = up;
  document.getElementById("s-down").textContent = down;
  document.getElementById("s-same").textContent = rows.filter(r => r.cells[state.country].kind === "same").length;
  document.getElementById("t-scope").textContent = `本表 · ${L.countries[state.country]}：`;

  try { localStorage.setItem("vb-state", JSON.stringify(state)); } catch (e) {}
  history.replaceState(null, "", `#${state.chart}/${state.country}`);
}

tabsEl.addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  state.chart = t.dataset.c; render();
});
tabsEl.addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = CHARTS.indexOf(state.chart) + (e.key === "ArrowRight" ? 1 : -1);
  state.chart = CHARTS[(i + CHARTS.length) % CHARTS.length]; render();
  tabsEl.querySelector(`[data-c="${state.chart}"]`).focus();
});
chipsEl.addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  state.country = c.dataset.k; render();
});
render();
</script>
